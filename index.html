<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nick Asolas</title>
    <meta name="description" content="Nick Asolas — Communications and Content Director at North Point Ministries.">

    <link rel="shortcut icon" href="images/favicon.ico">

    <meta property="og:title" content="Nick Asolas">
    <meta property="og:description" content="Creative leader. Chemistry driver.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nickasolas.com/">

    <style>
        :root {
            --bg: #ffffff;
            --fg: #14161a;
            --muted: #6b7280;
            --line: #e5e7eb;
            --hover: #f5f6f8;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0f12;
                --fg: #f2f3f5;
                --muted: #9aa1ac;
                --line: #2a2d33;
                --hover: #1a1c21;
            }
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        main {
            width: 100%;
            max-width: 26rem;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 8vw, 2.75rem);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .tagline {
            margin: 0.75rem 0 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
        }

        .links {
            margin-top: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        a.button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.9rem 1.25rem;
            border: 1px solid var(--line);
            border-radius: 0.6rem;
            color: var(--fg);
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        a.button:hover,
        a.button:focus-visible {
            background: var(--hover);
            border-color: var(--muted);
        }

        a.button svg {
            width: 1.15rem;
            height: 1.15rem;
            fill: currentColor;
            flex: none;
        }

        footer {
            margin-top: 3rem;
            color: var(--muted);
            font-size: 0.8rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<main>
    <h1>Nick Asolas</h1>
    <p class="tagline">Creative leader. Chemistry driver.</p>
